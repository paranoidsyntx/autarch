specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Autarch
    network: arbitrum-sepolia
    source:
      address: "0x92750075a8D78862209Bc8da6F621A6631659739"
      abi: Autarch
      startBlock: 291386312
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CharacterMinted
        - DungeonCreated
        - DungeonItem
        - DungeonMonster
        - DungeonRest
        - DungeonStarted
        - ItemCreated
      abis:
        - name: Autarch
          file: ./abis/Autarch.json
      eventHandlers:
        - event: CharacterMinted(indexed uint256,string,uint256)
          handler: handleCharacterMinted
        - event: DungeonCreated(indexed bytes32,uint256)
          handler: handleDungeonCreated
        - event: DungeonItem(indexed uint256,indexed address,indexed bytes32,uint256,uint256[])
          handler: handleDungeonItem
        - event: DungeonMonster(indexed uint256,indexed uint8,uint256,uint256[])
          handler: handleDungeonMonster
        - event: DungeonRest(indexed uint256,uint256,uint256,uint256[])
          handler: handleDungeonRest
        - event: DungeonStarted(indexed uint256,indexed bytes32,uint256[])
          handler: handleDungeonStarted
        - event: ItemCreated(indexed bytes32,indexed address,string,string)
          handler: handleItemCreated
      file: ./src/autarch.ts
