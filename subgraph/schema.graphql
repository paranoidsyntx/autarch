type Character @entity(immutable: false) {
  id: Bytes! # address
  characterId: BigInt! # uint256
  name: String! # string
  classIndex: BigInt! # uint256
  balances: [Balance!]! @derivedFrom(field: "character")
}

type Item @entity(immutable: true) {
  id: Bytes! # address
  itemId: Bytes! # bytes32
  name: String! # string
  symbol: String! # string
}

type Balance @entity(immutable: false) {
  id: Bytes!
  item: Item!
  character: Character!
  amount: BigInt!
}