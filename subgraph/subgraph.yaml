specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Autarch
    network: arbitrum-sepolia
    source:
      address: "0x7655453e888B774fC31b7Cf96be8e353A30D00D1"
      abi: Autarch
      startBlock: 291386312
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Character
        - Item
        - Balance
      abis:
        - name: Autarch
          file: ./abis/Autarch.json
      eventHandlers:
        - event: CharacterMinted(indexed uint256,string,uint256,indexed address)
          handler: handleCharacterMinted
        - event: ItemCreated(indexed bytes32,indexed address,string,string)
          handler: handleItemCreated
      file: ./src/autarch.ts
templates:
  - kind: ethereum
    name: Item20
    network: arbitrum-sepolia
    source:
      abi: Item20
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Balance
      abis:
        - name: Item20
          file: ./abis/Item20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/item20.ts