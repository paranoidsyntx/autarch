"""
The severity level of a log entry.
Log levels are ordered from most to least severe: CRITICAL > ERROR > WARNING > INFO > DEBUG
"""
enum LogLevel {
  """Critical errors that require immediate attention"""
  CRITICAL
  """Error conditions that indicate a failure"""
  ERROR
  """Warning conditions that may require attention"""
  WARNING
  """Informational messages about normal operations"""
  INFO
  """Detailed diagnostic information for debugging"""
  DEBUG
}

"""Defines the order direction, either ascending or descending"""
enum OrderDirection {
  asc
  desc
}

type Query {
  character(
    id: ID!
    """
    The block at which the query should be executed. Can either be a `{ hash: Bytes }` value containing a block hash, a `{ number: Int }` containing the block number, or a `{ number_gte: Int }` containing the minimum block number. In the case of `number_gte`, the query will be executed on the latest block only if the subgraph has progressed to or past the minimum block number. Defaults to the latest block when omitted.
    """
    block: Block_height
    """
    Set to `allow` to receive data even if the subgraph has skipped over errors while syncing.
    """
    subgraphError: _SubgraphErrorPolicy_! = deny
  ): Character
  characters(
    skip: Int = 0
    first: Int = 100
    orderBy: Character_orderBy
    orderDirection: OrderDirection
    where: Character_filter
    """
    The block at which the query should be executed. Can either be a `{ hash: Bytes }` value containing a block hash, a `{ number: Int }` containing the block number, or a `{ number_gte: Int }` containing the minimum block number. In the case of `number_gte`, the query will be executed on the latest block only if the subgraph has progressed to or past the minimum block number. Defaults to the latest block when omitted.
    """
    block: Block_height
    """
    Set to `allow` to receive data even if the subgraph has skipped over errors while syncing.
    """
    subgraphError: _SubgraphErrorPolicy_! = deny
  ): [Character!]!
  item(
    id: ID!
    """
    The block at which the query should be executed. Can either be a `{ hash: Bytes }` value containing a block hash, a `{ number: Int }` containing the block number, or a `{ number_gte: Int }` containing the minimum block number. In the case of `number_gte`, the query will be executed on the latest block only if the subgraph has progressed to or past the minimum block number. Defaults to the latest block when omitted.
    """
    block: Block_height
    """
    Set to `allow` to receive data even if the subgraph has skipped over errors while syncing.
    """
    subgraphError: _SubgraphErrorPolicy_! = deny
  ): Item
  items(
    skip: Int = 0
    first: Int = 100
    orderBy: Item_orderBy
    orderDirection: OrderDirection
    where: Item_filter
    """
    The block at which the query should be executed. Can either be a `{ hash: Bytes }` value containing a block hash, a `{ number: Int }` containing the block number, or a `{ number_gte: Int }` containing the minimum block number. In the case of `number_gte`, the query will be executed on the latest block only if the subgraph has progressed to or past the minimum block number. Defaults to the latest block when omitted.
    """
    block: Block_height
    """
    Set to `allow` to receive data even if the subgraph has skipped over errors while syncing.
    """
    subgraphError: _SubgraphErrorPolicy_! = deny
  ): [Item!]!
  balance(
    id: ID!
    """
    The block at which the query should be executed. Can either be a `{ hash: Bytes }` value containing a block hash, a `{ number: Int }` containing the block number, or a `{ number_gte: Int }` containing the minimum block number. In the case of `number_gte`, the query will be executed on the latest block only if the subgraph has progressed to or past the minimum block number. Defaults to the latest block when omitted.
    """
    block: Block_height
    """
    Set to `allow` to receive data even if the subgraph has skipped over errors while syncing.
    """
    subgraphError: _SubgraphErrorPolicy_! = deny
  ): Balance
  balances(
    skip: Int = 0
    first: Int = 100
    orderBy: Balance_orderBy
    orderDirection: OrderDirection
    where: Balance_filter
    """
    The block at which the query should be executed. Can either be a `{ hash: Bytes }` value containing a block hash, a `{ number: Int }` containing the block number, or a `{ number_gte: Int }` containing the minimum block number. In the case of `number_gte`, the query will be executed on the latest block only if the subgraph has progressed to or past the minimum block number. Defaults to the latest block when omitted.
    """
    block: Block_height
    """
    Set to `allow` to receive data even if the subgraph has skipped over errors while syncing.
    """
    subgraphError: _SubgraphErrorPolicy_! = deny
  ): [Balance!]!
  """Access to subgraph metadata"""
  _meta(block: Block_height): _Meta_
  """
  Query execution logs emitted by the subgraph during indexing. Results are sorted by timestamp in descending order (newest first).
  """
  _logs(
    """
    Filter logs by severity level. Only logs at this level will be returned.
    """
    level: LogLevel
    """
    Filter logs from this timestamp onwards (inclusive). Must be in RFC3339 format (e.g., '2024-01-15T10:30:00Z').
    """
    from: String
    """
    Filter logs until this timestamp (inclusive). Must be in RFC3339 format (e.g., '2024-01-15T23:59:59Z').
    """
    to: String
    """
    Search for logs containing this text in the message. Case-insensitive substring match. Maximum length: 1000 characters.
    """
    search: String
    """Maximum number of logs to return. Default: 100, Maximum: 1000."""
    first: Int = 100
    """Number of logs to skip (for pagination). Default: 0, Maximum: 10000."""
    skip: Int = 0
    """Sort direction for results. Default: desc (newest first)."""
    orderDirection: OrderDirection = desc
  ): [_Log_!]!
}

"""A string representation of microseconds UNIX timestamp (16 digits)"""
scalar Timestamp

type _Block_ {
  """The hash of the block"""
  hash: Bytes
  """The block number"""
  number: Int!
  """Integer representation of the timestamp stored in blocks for the chain"""
  timestamp: Int
  """The hash of the parent block"""
  parentHash: Bytes
}

"""
A key-value pair of additional data associated with a log entry.
These correspond to arguments passed to the log function in the subgraph code.
"""
type _LogArgument_ {
  """The parameter name"""
  key: String!
  """The parameter value, serialized as a string"""
  value: String!
}

"""
Source code location metadata for a log entry.
Indicates where in the subgraph's AssemblyScript code the log statement was executed.
"""
type _LogMeta_ {
  """The module or file path where the log was emitted"""
  module: String!
  """The line number in the source file"""
  line: Int!
  """The column number in the source file"""
  column: Int!
}

"""
A log entry emitted by a subgraph during indexing.
Logs can be generated by the subgraph's AssemblyScript code using the `log.*` functions.
"""
type _Log_ {
  """Unique identifier for this log entry"""
  id: String!
  """The deployment hash of the subgraph that emitted this log"""
  subgraphId: String!
  """
  The timestamp when the log was emitted, in RFC3339 format (e.g., '2024-01-15T10:30:00Z')
  """
  timestamp: String!
  """The severity level of the log entry"""
  level: LogLevel!
  """The log message text"""
  text: String!
  """
  Additional structured data passed to the log function as key-value pairs
  """
  arguments: [_LogArgument_!]!
  """
  Metadata about the source location in the subgraph code where the log was emitted
  """
  meta: _LogMeta_!
}

"""The type for the top-level _meta field"""
type _Meta_ {
  """
  Information about a specific subgraph block. The hash of the block
  will be null if the _meta field has a block constraint that asks for
  a block number. It will be filled if the _meta field has no block constraint
  and therefore asks for the latest  block
  """
  block: _Block_!
  """The deployment ID"""
  deployment: String!
  """If `true`, the subgraph encountered indexing errors at some past block"""
  hasIndexingErrors: Boolean!
}

enum _SubgraphErrorPolicy_ {
  """Data will be returned even if the subgraph has indexing errors"""
  allow
  """
  If the subgraph has indexing errors, data will be omitted. The default.
  """
  deny
}